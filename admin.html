<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLALANGAN.NET - Panel Admin</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon 6.4.0 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: contain;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .icon-member-yellow {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.4);
        }
        .icon-member-green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
        }
        .icon-member-orange {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.4);
        }
        .icon-member-purple {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            box-shadow: 0 10px 15px -3px rgba(168, 85, 247, 0.4);
        }
        .icon-member-blue {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }
        .icon-member-cyan {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            box-shadow: 0 10px 15px -3px rgba(6, 182, 212, 0.4);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex justify-center items-start text-slate-800 select-none">

    <!-- Container Utama App Admin -->
    <div class="w-full max-w-md bg-slate-50 min-h-screen pb-28 relative flex flex-col shadow-lg overflow-hidden" id="app-container">

        <!-- ================= 1. FORM LOGIN ADMIN (PIN) ================= -->
        <div id="login-admin-page" class="flex-1 flex flex-col justify-center items-center px-6 py-12 bg-white relative z-10">
            <div class="text-center mb-8">
                <div class="w-20 h-20 icon-member-yellow rounded-3xl flex items-center justify-center mx-auto mb-3 shadow-lg">
                    <i class="fa-solid fa-key text-3xl text-white drop-shadow-md"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-800">AKSES OTORITAS</h2>
                <p class="text-xs text-slate-400 mt-1">Masukkan Kunci Khusus / PIN Admin</p>
            </div>
            <div class="w-full space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-500 block mb-1">PIN Khusus Admin</label>
                    <input type="password" id="input-admin-pin" placeholder="••••••••" class="w-full border border-slate-200 rounded-2xl px-4 py-3.5 text-sm focus:outline-none focus:border-amber-500 tracking-widest text-center text-lg font-bold bg-slate-50">
                </div>
                <button onclick="prosesLoginAdmin()" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-bold rounded-2xl py-3.5 text-sm shadow-md shadow-blue-200 transition-all">MASUK DASHBOARD ADMIN</button>
                <p id="msg-admin-error" class="text-xs text-red-500 text-center hidden font-medium"></p>
            </div>
        </div>

        <!-- ================= 2. DASHBOARD ADMIN ================= -->
        <div id="dashboard-page" class="hidden flex-1 flex flex-col h-full z-10">
            <!-- HEADER -->
            <header class="flex items-center justify-between px-6 pt-6 pb-4 bg-white shrink-0 border-b border-slate-100">
                <div class="flex flex-col">
                    <span class="text-xl font-extrabold tracking-tight">
                        <span class="text-amber-400">PLALANGAN</span><span class="text-blue-600">.NET</span>
                    </span>
                    <span class="text-[9px] text-slate-400 -mt-1 font-medium">by Remaja Plalangan</span>
                </div>
                
                <div class="flex items-center space-x-3">
                    <div class="text-right">
                        <span class="text-[10px] text-slate-400 block">Hallo</span>
                        <span class="text-xs font-bold text-slate-800">Admin</span>
                    </div>
                    <button onclick="if(confirm('Keluar dari Panel Admin?')) logoutApp();" class="w-10 h-10 rounded-full icon-member-blue flex items-center justify-center active:scale-95 transition-all shadow-md cursor-pointer" title="Keluar / Logout">
                    <i class="fa-solid fa-right-from-bracket text-white text-sm"></i>
                </button>
                </div>
            </header>

            <!-- KONTEN UTAMA DENGAN SCROLL -->
            <main id="main-content" class="px-5 space-y-5 flex-1 overflow-y-auto no-scrollbar pt-3">
                <!-- Dirender secara dinamis oleh JS -->
            </main>

            <!-- BOTTOM NAVIGATION BAR -->
            <nav id="bottom-nav-bar" class="absolute bottom-3 left-3 right-3 bg-white/90 backdrop-blur-md rounded-3xl shadow-xl border border-slate-100 p-2 flex justify-between items-center z-50">
                <button onclick="switchTabAdmin('home')" id="nav-home" class="nav-item flex flex-col items-center justify-center py-1.5 px-2 rounded-2xl text-blue-600 bg-blue-50/80 transition-all">
                    <div class="w-7 h-7 rounded-xl icon-member-blue flex items-center justify-center text-xs mb-1">
                        <i class="fa-solid fa-house text-white"></i>
                    </div>
                    <span class="text-[9px] font-bold">Home</span>
                </button>
                <button onclick="switchTabAdmin('pesanan')" id="nav-pesanan" class="nav-item flex flex-col items-center justify-center py-1.5 px-2 rounded-2xl text-slate-400 hover:text-slate-600 transition-all">
                    <div class="w-7 h-7 rounded-xl icon-member-cyan flex items-center justify-center text-xs mb-1">
                        <i class="fa-solid fa-cart-shopping text-white"></i>
                    </div>
                    <span class="text-[9px] font-medium">Pesanan</span>
                </button>
                <button onclick="switchTabAdmin('pelanggan')" id="nav-pelanggan" class="nav-item flex flex-col items-center justify-center py-1.5 px-2 rounded-2xl text-slate-400 hover:text-slate-600 transition-all">
                    <div class="w-7 h-7 rounded-xl icon-member-yellow flex items-center justify-center text-xs mb-1">
                        <i class="fa-solid fa-users text-white"></i>
                    </div>
                    <span class="text-[9px] font-medium">Member</span>
                </button>
                <button onclick="switchTabAdmin('tabungan')" id="nav-tabungan" class="nav-item flex flex-col items-center justify-center py-1.5 px-2 rounded-2xl text-slate-400 hover:text-slate-600 transition-all">
                    <div class="w-7 h-7 rounded-xl icon-member-green flex items-center justify-center text-xs mb-1">
                        <i class="fa-solid fa-wallet text-white"></i>
                    </div>
                    <span class="text-[9px] font-medium">Tabungan</span>
                </button>
                <button onclick="switchTabAdmin('beban')" id="nav-beban" class="nav-item flex flex-col items-center justify-center py-1.5 px-2 rounded-2xl text-slate-400 hover:text-slate-600 transition-all">
                    <div class="w-7 h-7 rounded-xl icon-member-orange flex items-center justify-center text-xs mb-1">
                        <i class="fa-solid fa-hand-holding-dollar text-white"></i>
                    </div>
                    <span class="text-[9px] font-medium">Iuran</span>
                </button>
            </nav>
        </div>

    </div>

    <!-- MODAL INPUT TRANSAKSI TABUNGAN -->
    <div id="modal-tabungan" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl space-y-4 relative">
            <button onclick="tutupModalTabungan()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <div class="flex items-center space-x-2.5">
                <div class="w-10 h-10 icon-member-green rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-wallet text-white text-base"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800">Catat Transaksi Tabungan</h3>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-500 mb-1.5">Jenis Transaksi</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="btn-jns-masuk" onclick="pilihJenisTrans('MASUK')" class="py-3 rounded-2xl font-bold border border-emerald-500 bg-emerald-50 text-emerald-600 shadow-sm transition-all">Pemasukan (+)</button>
                        <button type="button" id="btn-jns-keluar" onclick="pilihJenisTrans('KELUAR')" class="py-3 rounded-2xl font-bold border border-slate-200 text-slate-500 transition-all">Pengeluaran (-)</button>
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 mb-1.5">Keterangan</label>
                    <input type="text" id="input-trans-ket" placeholder="Contoh: Kas Iuran / Beli Kabel" class="w-full border border-slate-200 rounded-2xl px-4 py-3 focus:outline-none focus:border-emerald-500 bg-slate-50">
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 mb-1.5">Nominal (Rp)</label>
                    <input type="number" id="input-trans-nominal" placeholder="0" class="w-full border border-slate-200 rounded-2xl px-4 py-3 focus:outline-none focus:border-emerald-500 font-bold text-slate-800 bg-slate-50">
                </div>
            </div>

            <div class="pt-2 flex space-x-2">
                <button onclick="tutupModalTabungan()" class="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-2xl font-bold text-xs transition-colors">Batal</button>
                <button onclick="simpanTransaksiTabungan()" id="btn-simpan-trans" class="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-xs shadow-md shadow-emerald-200 transition-all">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL INPUT VOUCHER -->
    <div id="modal-input-voucher" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl space-y-4 relative">
            <button onclick="tutupModalVoucher()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <div class="flex items-center space-x-2.5">
                <div class="w-10 h-10 icon-member-blue rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-ticket text-white text-base"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800">Input Kode Voucher</h3>
            </div>
            
            <div class="space-y-3 text-xs">
                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                    <p class="text-[10px] text-slate-400 font-semibold uppercase">Pelanggan</p>
                    <p id="vch-target-nama" class="font-bold text-slate-800 text-sm mt-0.5">-</p>
                    <p id="vch-target-id" class="text-[10px] text-blue-600 font-mono font-medium mt-0.5">ID: -</p>
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 mb-1.5">Kode Voucher Hotspot</label>
                    <input type="text" id="input-kode-voucher" placeholder="Contoh: PLALANGAN-889" class="w-full border border-slate-200 rounded-2xl px-4 py-3 focus:outline-none focus:border-blue-500 font-mono font-bold text-slate-800 uppercase tracking-wider bg-slate-50">
                </div>
            </div>

            <div class="pt-2 flex space-x-2">
                <button onclick="tutupModalVoucher()" class="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-2xl font-bold text-xs transition-colors">Batal</button>
                <button onclick="simpanVoucherAdmin()" id="btn-simpan-vch" class="flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold text-xs shadow-md shadow-blue-200 transition-all">Simpan Voucher</button>
            </div>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT ADMIN -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzqU0DFsCpHcjHTkbrnezy8eDRQOn0IjNEJ9cx_5arW--F6-WUWqAZ5GJHgLIuLo28b/exec";
        const PIN_ADMIN_RAHASIA = "25121987";

        let selectedJenisTrans = "MASUK";
        let targetVoucherUser = { idUser: '', nama: '' };
        let activeSubTabPesanan = "Listrik";

        let dbAdminState = {
            totalMember: 0,
            totalOmset: 0,
            lunasCount: 0,
            pendingCount: 0, 
            listPelanggan: [],
            dataIuran: [],
            totalSisaSaldo: 0,
            dataTabungan: [],
            orders: { Listrik: [], BeliLampu: [], Print: [], Jastip: [] }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedRole = localStorage.getItem('app_role');
            if (savedRole === 'admin') {
                masukDashboardAdmin();
            }
        });

        function prosesLoginAdmin() {
            const pinInput = document.getElementById('input-admin-pin').value.trim();
            const errorMsg = document.getElementById('msg-admin-error');

            if (pinInput === PIN_ADMIN_RAHASIA) {
                localStorage.setItem('app_role', 'admin');
                masukDashboardAdmin();
            } else {
                errorMsg.innerText = "PIN Khusus Admin Salah!";
                errorMsg.classList.remove('hidden');
            }
        }

        function masukDashboardAdmin() {
            document.getElementById('login-admin-page').classList.add('hidden');
            document.getElementById('dashboard-page').classList.remove('hidden');
            muatDataOtomatisAdmin();
        }

        function muatDataOtomatisAdmin() {
            fetch(`${API_URL}?action=GET_STATS`)
                .then(res => res.json())
                .then(res => {
                    if(res.success) {
                        dbAdminState.totalMember = res.totalMember || 0;
                        dbAdminState.totalOmset = res.totalOmset || 0;
                        dbAdminState.lunasCount = res.lunasCount || 0;
                        dbAdminState.pendingCount = res.pendingCount || 0;
                        dbAdminState.listPelanggan = res.dataAnggota || [];
                        dbAdminState.dataIuran = res.dataIuran || [];
                        dbAdminState.totalSisaSaldo = res.totalSisaSaldo || 0;
                        dbAdminState.dataTabungan = res.dataTabungan || [];
                        
                        const activeNav = document.getElementById('nav-pesanan');
                        if (!activeNav || !activeNav.classList.contains('text-blue-600')) {
                            switchTabAdmin('home');
                        }
                    }
                }).catch(err => console.error("Error Get Stats:", err));

            fetch(`${API_URL}?action=GET_ORDERS`)
                .then(res => res.json())
                .then(res => {
                    if(res.success && res.orders) {
                        dbAdminState.orders = res.orders;
                        const activeNav = document.getElementById('nav-pesanan');
                        if (activeNav && activeNav.classList.contains('text-blue-600')) {
                            renderTabPesanan();
                        }
                    }
                }).catch(err => console.error("Error Get Orders:", err));
        }

        function renderHomeTab() {
            const opsiBulan = { month: 'long', year: 'numeric' };
            const bulanIni = new Date().toLocaleDateString('id-ID', opsiBulan);

            let totalUangMasuk = dbAdminState.listPelanggan
                .filter(p => p.statusTagihan === 'Lunas')
                .reduce((sum, p) => sum + (p.totalBayar || 0), 0);

            const dataPending = dbAdminState.listPelanggan.filter(p => p.statusTagihan !== 'Lunas');
            
            let listAntreanHTML = "";
            if(dataPending.length === 0) {
                listAntreanHTML = `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 text-center text-xs text-emerald-600 py-6 font-semibold">
                        <i class="fa-solid fa-circle-check text-lg mb-1 block"></i> Semua tagihan internet bulan ini lunas!
                    </div>`;
            } else {
                listAntreanHTML = dataPending.map(item => `
                    <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-100/80 flex justify-between items-center space-x-3">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-2">
                                <h4 class="text-xs font-bold text-slate-800 uppercase truncate">${item.nama}</h4>
                                <span class="bg-red-50 text-red-500 font-bold text-[9px] px-2 py-0.5 rounded-md uppercase tracking-wider shrink-0">Belum Bayar</span>
                            </div>
                            <p class="text-[10px] text-slate-400 mt-0.5 truncate">${item.idUser} • ${item.tanggalAktivasi || '-'}</p>
                            <div class="text-sm font-black text-red-500 mt-0.5">Rp ${(item.totalBayar || 0).toLocaleString('id-ID')}</div>
                        </div>
                        <button type="button" 
                                onclick="eksekusiBayarAdmin('${item.idUser}', '${item.nama}', this)" 
                                class="bg-blue-600 active:bg-blue-800 text-white rounded-xl py-2.5 px-4 text-[11px] font-bold flex items-center space-x-1 shadow-md shadow-blue-100 shrink-0 transition-transform active:scale-95 cursor-pointer select-none">
                            <i class="fa-solid fa-check text-[10px]"></i>
                            <span>Bayar</span>
                        </button>
                    </div>
                `).join('');
            }

            return `
                <section class="bg-gradient-to-tr from-blue-600 via-blue-500 to-indigo-600 rounded-3xl p-6 text-white shadow-xl shadow-blue-100 relative overflow-hidden">
                    <div class="absolute -right-10 -top-10 w-32 h-32 bg-white opacity-10 rounded-full blur-sm"></div>
                    <div class="absolute -right-4 -bottom-10 w-24 h-24 bg-white opacity-10 rounded-full"></div>
                    
                    <h3 class="text-xs font-medium text-blue-100 tracking-wide">Total Belum Tertagih</h3>
                    <div class="text-3xl font-black mt-2 tracking-tight">Rp ${dbAdminState.totalOmset.toLocaleString('id-ID')}</div>
                    <div class="text-[10px] font-semibold bg-white/20 inline-block px-2.5 py-1 rounded-xl mt-2 mb-1 backdrop-blur-sm">● Total Masuk: Rp ${totalUangMasuk.toLocaleString('id-ID')}</div>
                    <p class="text-xs text-blue-100 mt-0.5">Periode  • ${bulanIni}</p>
                    
                    <button onclick="switchTabAdmin('pelanggan')" class="absolute right-5 bottom-6 bg-white text-blue-600 font-bold text-xs px-4 py-2.5 rounded-2xl shadow-md hover:bg-blue-50 transition-all">
                        Kelola
                    </button>
                </section>

                <section class="grid grid-cols-4 gap-2 text-center">
                    <button onclick="switchTabAdmin('pesanan')" class="bg-white p-3 rounded-3xl flex flex-col items-center justify-center shadow-sm border border-slate-100/80 hover:bg-slate-50 transition-all group">
                        <div class="w-10 h-10 icon-member-cyan rounded-2xl flex items-center justify-center text-white mb-1.5 group-hover:scale-105 transition-transform">
                            <i class="fa-solid fa-cart-shopping text-base"></i>
                        </div>
                        <span class="text-[10px] font-bold text-slate-700">Pesanan</span>
                    </button>
                    <button onclick="switchTabAdmin('pelanggan')" class="bg-white p-3 rounded-3xl flex flex-col items-center justify-center shadow-sm border border-slate-100/80 hover:bg-slate-50 transition-all group">
                        <div class="w-10 h-10 icon-member-yellow rounded-2xl flex items-center justify-center text-white mb-1.5 group-hover:scale-105 transition-transform">
                            <i class="fa-solid fa-users text-base"></i>
                        </div>
                        <span class="text-[10px] font-bold text-slate-700">Member</span>
                    </button>
                    <button onclick="switchTabAdmin('tabungan')" class="bg-white p-3 rounded-3xl flex flex-col items-center justify-center shadow-sm border border-slate-100/80 hover:bg-slate-50 transition-all group">
                        <div class="w-10 h-10 icon-member-green rounded-2xl flex items-center justify-center text-white mb-1.5 group-hover:scale-105 transition-transform">
                            <i class="fa-solid fa-wallet text-base"></i>
                        </div>
                        <span class="text-[10px] font-bold text-slate-700">Tabungan</span>
                    </button>
                    <button onclick="switchTabAdmin('beban')" class="bg-white p-3 rounded-3xl flex flex-col items-center justify-center shadow-sm border border-slate-100/80 hover:bg-slate-50 transition-all group">
                        <div class="w-10 h-10 icon-member-orange rounded-2xl flex items-center justify-center text-white mb-1.5 group-hover:scale-105 transition-transform">
                            <i class="fa-solid fa-hand-holding-dollar text-base"></i>
                        </div>
                        <span class="text-[10px] font-bold text-slate-700">Iuran</span>
                    </button>
                </section>

                <section class="grid grid-cols-3 gap-3">
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100/80">
                        <p class="text-[10px] font-semibold text-slate-400">Total Member</p>
                        <p class="text-2xl font-black text-blue-600 mt-1">${dbAdminState.totalMember}</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">Anggota</p>
                    </div>
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100/80">
                        <p class="text-[10px] font-semibold text-slate-400">Sudah Bayar</p>
                        <p class="text-2xl font-black text-emerald-500 mt-1">${dbAdminState.lunasCount}</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">Lunas</p>
                    </div>
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100/80">
                        <p class="text-[10px] font-semibold text-slate-400">Belum Bayar</p>
                        <p class="text-2xl font-black text-red-500 mt-1">${dbAdminState.pendingCount}</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">Pending</p>
                    </div>
                </section>

                <section class="space-y-2.5">
                    <div class="flex items-center justify-between px-1">
                        <div class="flex items-center space-x-2">
                            <div class="w-1.5 h-4 bg-blue-600 rounded-full"></div>
                            <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Antrean Konfirmasi Pembayaran</h2>
                        </div>
                        <button onclick="switchTabAdmin('pelanggan')" class="text-[11px] font-bold text-blue-600 hover:underline">Lihat Semua</button>
                    </div>
                    <div id="antrean-admin-wrapper" class="max-h-[320px] overflow-y-auto pr-1 custom-scrollbar space-y-2.5">
                        ${listAntreanHTML}
                    </div>
                </section>
            `;
        }

        function renderTabPesanan() {
            const mainContent = document.getElementById('main-content');
            if (!mainContent) return;
            
            const ordersData = dbAdminState.orders || {};
            const listOrders = ordersData[activeSubTabPesanan] || [];

            let listHTML = "";
            if (listOrders.length === 0) {
                listHTML = `
                    <div class="p-8 text-center text-xs text-slate-400 bg-white rounded-3xl border border-slate-100 shadow-sm font-medium space-y-2">
                        <i class="fa-solid fa-inbox text-3xl opacity-30 block"></i>
                        <p>Belum ada pesanan masuk di kategori <span class="font-bold text-slate-600">${activeSubTabPesanan}</span>.</p>
                    </div>`;
            } else {
                listHTML = listOrders.map(item => {
                    const isSelesai = (item.status || '').toLowerCase() === 'selesai';
                    const cleanPhone = (item.idUser || '').replace(/[^0-9]/g, '');

                    return `
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-2.5">
                            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                                <div>
                                    <h4 class="text-xs font-bold text-slate-800 uppercase">${item.nama || 'Tanpa Nama'}</h4>
                                    <p class="text-[10px] text-slate-400 mt-0.5">${item.idUser} • ${item.tanggal}</p>
                                </div>
                                <span class="text-[9px] font-bold px-2.5 py-1 rounded-full uppercase ${isSelesai ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
                                    ${item.status || 'Pending'}
                                </span>
                            </div>

                            <div class="text-xs text-slate-700 space-y-1">
                                <p><span class="font-semibold text-slate-400">Detail:</span> ${item.detail1}</p>
                                ${item.detail2 && item.detail2 !== '-' ? `<p><span class="font-semibold text-slate-400">Keterangan:</span> ${item.detail2}</p>` : ''}
                                ${item.harga && item.harga !== '-' ? `<p><span class="font-semibold text-slate-400">Harga:</span> <span class="font-bold text-emerald-600">${item.harga}</span></p>` : ''}
                            </div>

                            <div class="pt-2 border-t border-slate-100 flex justify-end items-center space-x-2">
                                ${cleanPhone ? `
                                    <a href="https://wa.me/${cleanPhone}" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1 shadow-sm">
                                        <i class="fa-brands fa-whatsapp"></i>
                                        <span>Chat WA</span>
                                    </a>
                                ` : ''}

                                ${!isSelesai ? `
                                    <button onclick="prosesSelesaiOrder('${activeSubTabPesanan}', ${item.rowIdx}, this)" class="bg-blue-600 hover:bg-blue-700 text-white px-3 text-xs py-1.5 rounded-xl font-semibold shadow-sm transition-colors">
                                        Selesaikan
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            mainContent.innerHTML = `
                <div class="space-y-4 pt-2 pb-12">
                    <div class="flex items-center space-x-2">
                        <div class="w-1.5 h-4 bg-cyan-600 rounded-full"></div>
                        <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Pesanan Warga</h2>
                    </div>

                    <div class="grid grid-cols-4 gap-1.5 bg-slate-200/80 p-1 rounded-2xl text-[10px] font-bold">
                        <button onclick="switchSubTabPesanan('Listrik')" class="py-2 rounded-xl transition-all ${activeSubTabPesanan === 'Listrik' ? 'bg-white text-amber-600 shadow-sm' : 'text-slate-500'}">
                            Listrik
                        </button>
                        <button onclick="switchSubTabPesanan('BeliLampu')" class="py-2 rounded-xl transition-all ${activeSubTabPesanan === 'BeliLampu' ? 'bg-white text-rose-600 shadow-sm' : 'text-slate-500'}">
                            Lampu
                        </button>
                        <button onclick="switchSubTabPesanan('Print')" class="py-2 rounded-xl transition-all ${activeSubTabPesanan === 'Print' ? 'bg-white text-cyan-600 shadow-sm' : 'text-slate-500'}">
                            Print
                        </button>
                        <button onclick="switchSubTabPesanan('Jastip')" class="py-2 rounded-xl transition-all ${activeSubTabPesanan === 'Jastip' ? 'bg-white text-purple-600 shadow-sm' : 'text-slate-500'}">
                            Jastip
                        </button>
                    </div>

                    <div class="space-y-3">
                        ${listHTML}
                    </div>
                </div>
            `;
        }

        function switchTabAdmin(tabName) {
            const mainContent = document.getElementById('main-content');
            if(!mainContent) return;
            
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('text-blue-600', 'bg-blue-50/80');
                el.classList.add('text-slate-400');
            });
            const activeNav = document.getElementById(`nav-${tabName}`);
            if (activeNav) {
                activeNav.classList.remove('text-slate-400');
                activeNav.classList.add('text-blue-600', 'bg-blue-50/80');
            }

            if (tabName === 'home') {
                mainContent.innerHTML = renderHomeTab();
            } 
            else if (tabName === 'pesanan') {
                renderTabPesanan();
            }
            else if (tabName === 'pelanggan') {
                mainContent.innerHTML = `
                    <div class="space-y-3 pt-2">
                        <div class="flex items-center justify-between px-1">
                            <div class="flex items-center space-x-2">
                                <div class="w-1.5 h-4 bg-blue-600 rounded-full"></div>
                                <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Daftar Anggota Aktif</h2>
                            </div>
                            <span class="text-[9px] text-slate-400 font-semibold">*Klik nama untuk input voucher</span>
                        </div>
                        <div class="bg-white rounded-3xl p-3 shadow-sm border border-slate-100/80 max-h-[650px] overflow-y-auto pr-1 custom-scrollbar divide-y divide-slate-100">
                            ${dbAdminState.listPelanggan.map(p => `
                                <div class="py-3 px-3 flex justify-between items-center text-xs hover:bg-slate-50/60 rounded-2xl transition-colors">
                                    <div onclick="bukaModalVoucher('${p.idUser}', '${p.nama}')" class="min-w-0 flex-1 pr-2 cursor-pointer">
                                        <div class="flex items-center space-x-2">
                                            <p class="font-bold text-slate-800 uppercase truncate">${p.nama}</p>
                                            <span class="bg-blue-50 text-blue-600 p-1 rounded-lg text-[9px]"><i class="fa-solid fa-ticket"></i></span>
                                        </div>
                                        <p class="text-[10px] text-slate-400 mt-0.5 font-medium">ID: ${p.idUser} • Aktif: ${p.tanggalAktivasi || '-'}</p>
                                    </div>
                                    <span class="text-[11px] font-black px-2.5 py-1 rounded-xl shrink-0 ${p.statusTagihan === 'Lunas' ? 'text-emerald-600 bg-emerald-50' : 'text-red-500 bg-red-50'}">${p.statusTagihan || 'Belum Bayar'}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } 
// ====================================================================
            // [TAB TABUNGAN ADMIN] MODE TABEL SUPER MIKRO & SHEETS (GRID KOTAK)
            // ====================================================================
            else if (tabName === 'tabungan') {
                const sisaSaldoFormat = Number(dbAdminState.totalSisaSaldo || 0).toLocaleString('id-ID');
                
                let rowsTabunganHTML = (!dbAdminState.dataTabungan || dbAdminState.dataTabungan.length === 0)
                    ? `<tr><td colspan="5" class="py-4 text-center text-slate-400 border border-slate-200">Belum ada transaksi.</td></tr>`
                    : dbAdminState.dataTabungan.map((item) => `
                        <tr class="hover:bg-amber-50/50 transition-colors">
                            <td class="py-1 px-1.5 border border-slate-200 font-mono text-[9px] text-slate-600 whitespace-nowrap text-center">${item.tanggal}</td>
                            <td class="py-1 px-1.5 border border-slate-200 text-[9.5px] font-medium text-slate-800 leading-tight">${item.keterangan}</td>
                            <td class="py-1 px-1.5 border border-slate-200 text-[9.5px] font-bold text-emerald-600 text-right whitespace-nowrap">${item.masuk > 0 ? '+' + item.masuk.toLocaleString('id-ID') : ''}</td>
                            <td class="py-1 px-1.5 border border-slate-200 text-[9.5px] font-bold text-rose-500 text-right whitespace-nowrap">${item.keluar > 0 ? '-' + item.keluar.toLocaleString('id-ID') : ''}</td>
                            <td class="py-1 px-1.5 border border-slate-200 text-[9.5px] font-black text-blue-600 text-right whitespace-nowrap bg-slate-50/50">${item.sisa.toLocaleString('id-ID')}</td>
                        </tr>
                    `).join('');

                mainContent.innerHTML = `
                    <div class="space-y-2 pt-1 pb-12">
                        <!-- HEADER RINGKASAN SALDO (LEBIH RINGKAS) -->
                        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 rounded-xl p-3 text-white shadow-sm flex items-center justify-between">
                            <div>
                                <span class="text-[8.5px] font-bold uppercase tracking-wider text-emerald-100 block">Sisa Saldo Tabungan</span>
                                <div class="text-lg font-black leading-none mt-0.5">Rp ${sisaSaldoFormat}</div>
                            </div>
                            <button onclick="bukaModalTabungan()" class="bg-white text-emerald-700 font-extrabold text-[9.5px] px-3 py-1.5 rounded-lg shadow-sm hover:bg-emerald-50 active:scale-95 transition-all">
                                <i class="fa-solid fa-plus mr-1"></i>Catat
                            </button>
                        </div>

                        <!-- KOTAK TABEL MODEL GOOGLE SHEETS (BORDER KOTAK-KOTAK EKSPLISIT) -->
                        <div class="bg-white rounded-xl border border-slate-300 shadow-sm overflow-hidden">
                            <div class="max-h-[calc(100vh-210px)] overflow-y-auto custom-scrollbar">
                                <table class="w-full text-left border-collapse border border-slate-200">
                                    <thead class="bg-slate-100 sticky top-0 z-10">
                                        <tr class="text-[8.5px] font-extrabold text-slate-700 uppercase">
                                            <th class="py-1 px-1.5 border border-slate-300 text-center w-12 bg-slate-200/60">Tgl</th>
                                            <th class="py-1 px-1.5 border border-slate-300 bg-slate-200/60">Keterangan</th>
                                            <th class="py-1 px-1.5 border border-slate-300 text-right text-emerald-700 bg-slate-200/60">Masuk</th>
                                            <th class="py-1 px-1.5 border border-slate-300 text-right text-rose-700 bg-slate-200/60">Keluar</th>
                                            <th class="py-1 px-1.5 border border-slate-300 text-right text-blue-700 bg-slate-200/60">Saldo</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${rowsTabunganHTML}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (tabName === 'beban') {
                const opsiBulan = { month: 'long', year: 'numeric' };
                const bulanIni = new Date().toLocaleDateString('id-ID', opsiBulan);

                let listIuranAdminHTML = (!dbAdminState.dataIuran || dbAdminState.dataIuran.length === 0) 
                    ? `<div class="p-8 text-center text-xs text-slate-400">Belum ada data iuran kampung.</div>`
                    : dbAdminState.dataIuran.map(item => `
                        <div class="item-iuran-row py-3 px-3 flex justify-between items-center text-xs border-b border-slate-100 hover:bg-slate-50/80 rounded-xl transition-colors" data-nama="${(item.nama||'').toLowerCase()}" data-jenis="${(item.jenisIuran||'').toLowerCase()}">
                            <div class="min-w-0 pr-2">
                                <p class="font-bold text-slate-800 uppercase truncate">${item.nama}</p>
                                <p class="text-[10px] text-slate-500 mt-0.5">${item.jenisIuran || 'Iuran'} • <span class="font-semibold text-slate-700">Rp ${Number(item.nominal || 0).toLocaleString('id-ID')}</span></p>
                            </div>
                            ${(item.statusIuran || '').toLowerCase() === 'lunas' 
                                ? `<span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-xl shrink-0">LUNAS</span>`
                                : `<button onclick="prosesKonfirmasiIuranAdmin('${item.idUser}', '${item.jenisIuran||'Iuran'}', this)" class="bg-blue-600 active:bg-blue-800 text-white text-[11px] px-3.5 py-1.5 rounded-xl font-bold shadow-sm shrink-0">Bayar</button>`
                            }
                        </div>
                    `).join('');

                mainContent.innerHTML = `
                    <div class="space-y-3 pt-30 pb-12">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <div class="w-1.5 h-4 bg-orange-500 rounded-full"></div>
                                <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Iuran Kampung (${bulanIni})</h2>
                            </div>
                            <span class="text-[10px] font-bold text-slate-400">${dbAdminState.dataIuran.length} Data</span>
                        </div>

                        <!-- KOTAK PENCARIAN NAMA WARGA -->
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-xs text-slate-400"></i>
                            <input type="text" id="cari-iuran-input" onkeyup="filterCariIuran()" placeholder="Cari nama warga..." class="w-full bg-white border border-slate-200 rounded-2xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:border-orange-500 font-medium shadow-sm">
                        </div>

                        <!-- CONTAINER KOTAK SCROLL DAFTAR WARGA -->
                        <div class="bg-white rounded-3xl p-2.5 border border-slate-100 shadow-sm max-h-[590px] overflow-y-auto custom-scrollbar space-y-0.5" id="container-iuran-list">
                            ${listIuranAdminHTML}
                        </div>
                    </div>
                `;
            }
        }

        function filterCariIuran() {
            const input = document.getElementById('cari-iuran-input').value.toLowerCase();
            const rows = document.querySelectorAll('.item-iuran-row');
            
            rows.forEach(row => {
                const nama = row.getAttribute('data-nama') || '';
                const jenis = row.getAttribute('data-jenis') || '';
                
                if (nama.includes(input) || jenis.includes(input)) {
                    row.style.display = "flex";
                } else {
                    row.style.display = "none";
                }
            });
        }

        function switchSubTabPesanan(subTab) {
            activeSubTabPesanan = subTab;
            renderTabPesanan();
        }

        function prosesSelesaiOrder(sheetName, rowIdx, btn) {
            if (!confirm(`Tandai pesanan baris ${rowIdx} sebagai Selesai?`)) return;

            btn.disabled = true;
            btn.innerText = "Proses...";

            fetch(`${API_URL}?action=KONFIRMASI_ORDER&sheetName=${sheetName}&rowIdx=${rowIdx}`)
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        alert("Pesanan berhasil diselesaikan!");
                        muatDataOtomatisAdmin();
                    } else {
                        alert("Gagal memproses pesanan: " + res.message);
                        btn.disabled = false;
                        btn.innerText = "Selesaikan";
                    }
                })
                .catch(err => {
                    alert("Terjadi gangguan koneksi internet.");
                    btn.disabled = false;
                    btn.innerText = "Selesaikan";
                });
        }

        function eksekusiBayarAdmin(idUser, nama, btnElem) {
            if (!btnElem) return;
            btnElem.disabled = true;
            btnElem.innerHTML = `<span>Proses...</span>`;

            fetch(`${API_URL}?action=KONFIRMASI_LUNAS&id=${encodeURIComponent(idUser)}`)
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        alert(`Pembayaran atas nama ${nama} LUNAS!`);
                        muatDataOtomatisAdmin();
                    } else {
                        alert("Gagal: " + res.message);
                    }
                });
        }

        function prosesKonfirmasiIuranAdmin(idUser, jenis, btn) {
            btn.disabled = true;
            fetch(`${API_URL}?action=KONFIRMASI_IURAN_LUNAS&id=${idUser}&jenis=${encodeURIComponent(jenis)}`)
                .then(res => res.json())
                .then(res => {
                    if(res.success) {
                        alert(`Pelunasan ${jenis} LUNAS!`);
                        muatDataOtomatisAdmin();
                    }
                });
        }

        function bukaModalVoucher(idUser, nama) {
            targetVoucherUser = { idUser, nama };
            document.getElementById('vch-target-nama').innerText = nama;
            document.getElementById('vch-target-id').innerText = "ID: " + idUser;
            document.getElementById('input-kode-voucher').value = "";
            document.getElementById('modal-input-voucher').classList.remove('hidden');
        }

        function tutupModalVoucher() {
            document.getElementById('modal-input-voucher').classList.add('hidden');
        }

        function simpanVoucherAdmin() {
            const kodeVch = document.getElementById('input-kode-voucher').value.trim();
            if (!kodeVch) return alert("Harap masukkan kode voucher!");

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "TAMBAH_VOUCHER",
                    idUser: targetVoucherUser.idUser,
                    kodeVoucher: kodeVch
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    alert("Voucher berhasil ditambahkan!");
                    tutupModalVoucher();
                }
            });
        }

        function bukaModalTabungan() {
            document.getElementById('modal-tabungan').classList.remove('hidden');
        }

        function tutupModalTabungan() {
            document.getElementById('modal-tabungan').classList.add('hidden');
        }

        function pilihJenisTrans(jenis) {
            selectedJenisTrans = jenis;
            const btnMasuk = document.getElementById('btn-jns-masuk');
            const btnKeluar = document.getElementById('btn-jns-keluar');

            if (jenis === 'MASUK') {
                btnMasuk.className = "py-3 rounded-2xl font-bold border border-emerald-500 bg-emerald-50 text-emerald-600 shadow-sm transition-all";
                btnKeluar.className = "py-3 rounded-2xl font-bold border border-slate-200 text-slate-500 transition-all";
            } else {
                btnKeluar.className = "py-3 rounded-2xl font-bold border border-red-500 bg-red-50 text-red-600 shadow-sm transition-all";
                btnMasuk.className = "py-3 rounded-2xl font-bold border border-slate-200 text-slate-500 transition-all";
            }
        }

        function simpanTransaksiTabungan() {
            const ket = document.getElementById('input-trans-ket').value.trim();
            const nominal = Number(document.getElementById('input-trans-nominal').value) || 0;

            if (!ket || nominal <= 0) return alert("Isi keterangan & nominal dengan benar!");

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "TAMBAH_TRANSAKSI_TABUNGAN",
                    keterangan: ket,
                    jenis: selectedJenisTrans,
                    nominal: nominal
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    alert("Transaksi berhasil dicatat!");
                    tutupModalTabungan();
                    muatDataOtomatisAdmin();
                }
            });
        }

        function logoutApp() {
            localStorage.removeItem('app_role');
            window.location.reload();
        }
    </script>
</body>
</html>
