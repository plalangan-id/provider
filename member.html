<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLALANGAN.NET - App Member</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: contain;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ========================================================================
           [SEKAT STYLE 3D ICON] Dapatkan Efek Timbul & Gradient Modern
           ======================================================================== */
        .icon-3d-blue {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }
        .icon-3d-amber {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }
        .icon-3d-emerald {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }
        .icon-3d-purple {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }
        .icon-3d-rose {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            box-shadow: 0 10px 15px -3px rgba(244, 63, 94, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }
        .icon-3d-cyan {
            background: linear-gradient(135deg, #06b6d4 0%, #0e7490 100%);
            box-shadow: 0 10px 15px -3px rgba(6, 182, 212, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex justify-center items-start text-slate-800 select-none">

    <!-- CONTAINER UTAMA APP MEMBER -->
    <div class="w-full max-w-md bg-slate-50 min-h-screen pb-24 relative flex flex-col shadow-lg overflow-hidden" id="app-container">

        <!-- ========================================================================
           [SEKAT LAYOUT 1] FORM LOGIN MEMBER
           ======================================================================== -->
        <div id="login-member-page" class="flex-1 flex flex-col justify-center items-center px-6 py-12 bg-white relative z-10">
            <div class="text-center mb-8">
                <div class="w-20 h-20 icon-3d-blue rounded-3xl flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-wifi text-3xl drop-shadow-md"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight">
                    <span class="text-amber-400">PLALANGAN</span><span class="text-blue-600">.NET</span>
                </h1>
                <p class="text-xs text-slate-400 mt-1">Masuk Untuk Cek Tagihan Wifi | iuran Kampung</p>
            </div>
            
            <div class="w-full space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-500 block mb-1">ID User / No. Whatsapp (Gunakan 6281**********)</label>
                    <input type="text" id="input-id" placeholder="Contoh: 628123456789" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition-colors">
                </div>
                <button onclick="cekIdPelanggan()" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl py-3 text-sm shadow-sm transition-colors flex justify-center items-center">
                    <span>LOGIN MEMBER</span>
                </button>
                <p id="error-msg" class="text-xs text-red-500 text-center hidden"></p>
            </div>
        </div>

        <!-- ========================================================================
           [SEKAT LAYOUT 2] DASHBOARD MEMBER
           ======================================================================== -->
        <div id="dashboard-page" class="hidden flex-1 flex flex-col h-full z-10">
            <!-- HEADER -->
            <header class="flex items-center justify-between px-6 pt-6 pb-4 bg-white shrink-0 border-b border-slate-100">
                <div class="flex items-center space-x-3">
                    <div class="flex flex-col">
                        <span class="text-xl font-extrabold tracking-tight">
                            <span class="text-amber-400">PLALANGAN</span><span class="text-blue-600">.NET</span>
                        </span>
                        <span class="text-[9px] text-slate-400 -mt-1">by Remaja Plalangan</span>
                    </div>
                    <div class="h-6 w-[1px] bg-slate-200"></div>
                    <div class="flex flex-col">
                        <span class="text-xs text-slate-400 leading-none">Hallo</span>
                        <span id="user-nama" class="text-sm font-bold text-slate-700 mt-0.5">-</span>
                    </div>
                </div>
                
                <div class="flex items-center space-x-2">
                    <div class="w-10 h-10 rounded-full icon-3d-blue flex items-center justify-center">
                        <i class="fa-solid fa-user text-white text-base drop-shadow-md"></i>
                    </div>
                </div>
            </header>

            <!-- KONTEN UTAMA MEMBER (RENDER DENGAN JS) -->
            <main id="main-content" class="px-5 space-y-5 flex-1 overflow-y-auto no-scrollbar pt-2">
            </main>

            <!-- BOTTOM NAVIGATION BAR MEMBER -->
            <nav id="bottom-nav-bar" class="absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur-md rounded-2xl shadow-lg border border-slate-100 p-2 flex justify-between items-center z-50">
                <button onclick="switchTab('home')" id="nav-home" class="nav-item flex-1 flex flex-col items-center justify-center py-2 text-blue-600 rounded-xl transition-all">
                    <div class="w-8 h-8 icon-3d-blue rounded-xl flex items-center justify-center mb-1">
                        <i class="fa-solid fa-house text-xs drop-shadow-md"></i>
                    </div>
                    <span class="text-[10px] font-semibold">Home</span>
                </button>
                <button onclick="switchTab('tagihan')" id="nav-tagihan" class="nav-item flex-1 flex flex-col items-center justify-center py-2 text-slate-400 hover:text-slate-600 transition-all">
                    <div class="w-8 h-8 icon-3d-amber rounded-xl flex items-center justify-center mb-1 opacity-70 nav-icon-inactive">
                        <i class="fa-solid fa-file-lines text-xs drop-shadow-md"></i>
                    </div>
                    <span class="text-[10px] font-medium">Tagihan</span>
                </button>
                <button onclick="switchTab('voucher')" id="nav-voucher" class="nav-item flex-1 flex flex-col items-center justify-center py-2 text-slate-400 hover:text-slate-600 transition-all">
                    <div class="w-8 h-8 icon-3d-cyan rounded-xl flex items-center justify-center mb-1 opacity-70 nav-icon-inactive">
                        <i class="fa-solid fa-ticket text-xs drop-shadow-md"></i>
                    </div>
                    <span class="text-[10px] font-medium">Voucher</span>
                </button>
                <button onclick="switchTab('paket')" id="nav-paket" class="nav-item flex-1 flex flex-col items-center justify-center py-2 text-slate-400 hover:text-slate-600 transition-all">
                    <div class="w-8 h-8 icon-3d-emerald rounded-xl flex items-center justify-center mb-1 opacity-70 nav-icon-inactive">
                        <i class="fa-solid fa-hand-holding-dollar text-xs drop-shadow-md"></i>
                    </div>
                    <span class="text-[10px] font-medium">Iuran</span>
                </button>
                <button onclick="switchTab('akun')" id="nav-akun" class="nav-item flex-1 flex flex-col items-center justify-center py-2 text-slate-400 hover:text-slate-600 transition-all">
                    <div class="w-8 h-8 icon-3d-purple rounded-xl flex items-center justify-center mb-1 opacity-70 nav-icon-inactive">
                        <i class="fa-solid fa-user text-xs drop-shadow-md"></i>
                    </div>
                    <span class="text-[10px] font-medium">Akun</span>
                </button>
            </nav>
        </div>

    </div>

    <!-- ========================================================================
       [SEKAT LOGIKA JAVASCRIPT UTAMA]
       ======================================================================== -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzqU0DFsCpHcjHTkbrnezy8eDRQOn0IjNEJ9cx_5arW--F6-WUWqAZ5GJHgLIuLo28b/exec";

        let activeUserData = {
            nama: "-", idUser: "-", formattedTagihan: "0", formattedBasePaket: "0", qtyJumlah: "0", bulanIni: "-",
            isLunas: false, statusTeks: "Belum Bayar", nominalAsli: "0",
            vouchers: [], iuran: []
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedIdUser = localStorage.getItem('sesi_pelanggan_bytel');
            if (savedIdUser) {
                document.getElementById('input-id').value = savedIdUser;
                cekIdPelanggan();
            }
        });

        // ------------------------------------------------------------------------
        // Logika Login & Cek Data Member
        // ------------------------------------------------------------------------
        function cekIdPelanggan(isRefresh = false) {
            const idInput = document.getElementById('input-id').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const btnSubmit = document.getElementById('btn-submit');
            
            if (!idInput) {
                errorMsg.innerText = "Masukkan ID User terlebih dahulu!";
                errorMsg.classList.remove('hidden');
                return;
            }

            if(!isRefresh) {
                errorMsg.classList.add('hidden');
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = `<span>Memeriksa...</span>`;
            }

            fetch(`${API_URL}?id=${idInput}`)
                .then(response => response.json())
                .then(response => {
                    if(!isRefresh) {
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = `<span>LOGIN MEMBER</span>`;
                    }

                    if (response.success) {
                        localStorage.setItem('sesi_pelanggan_bytel', idInput);

                        document.getElementById('login-member-page').classList.add('hidden');
                        document.getElementById('dashboard-page').classList.remove('hidden');

                        let nilaiPaketAsli = Number(response.data.paket) || 0;
                        let qtyJumlahAsli = Number(response.data.jumlah) || 0;
                        const statusLunasDariServer = (response.data.status && response.data.status.toLowerCase() === 'lunas');
                        
                        const opsiBulan = { month: 'long', year: 'numeric' };
                        const bulanIni = new Date().toLocaleDateString('id-ID', opsiBulan);

                        const nominalAsliTerbayar = nilaiPaketAsli.toLocaleString('id-ID'); 
                        const formattedBasePaket = nilaiPaketAsli.toLocaleString('id-ID');

                        activeUserData = {
                            nama: response.data.nama,
                            idUser: response.data.idUser,
                            formattedTagihan: statusLunasDariServer ? "0" : nominalAsliTerbayar,
                            formattedBasePaket: formattedBasePaket,
                            qtyJumlah: qtyJumlahAsli,
                            bulanIni: bulanIni,
                            isLunas: statusLunasDariServer,
                            statusTeks: statusLunasDariServer ? "Lunas" : "Belum Bayar",
                            nominalAsli: nominalAsliTerbayar,
                            vouchers: response.vouchers || [],
                            iuran: Array.isArray(response.iuran) ? response.iuran : (response.data.iuran || [])
                        };

                        document.getElementById('user-nama').innerText = activeUserData.nama;
                        switchTab('home');
                    } else {
                        if(!isRefresh) {
                            errorMsg.innerText = response.message || "ID User tidak ditemukan.";
                            errorMsg.classList.remove('hidden');
                        }
                    }
                })
                .catch(error => {
                    if(!isRefresh) {
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = `<span>LOGIN MEMBER</span>`;
                        errorMsg.innerText = "Gagal memuat data. Periksa koneksi internet.";
                        errorMsg.classList.remove('hidden');
                    }
                });
        }

        // ------------------------------------------------------------------------
        // Logika Switch Tab / Tampilan Halaman
        // ------------------------------------------------------------------------
        function switchTab(tabName) {
            const mainContent = document.getElementById('main-content');
            if(!mainContent) return;
            
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('text-blue-600', 'font-semibold');
                el.classList.add('text-slate-400');
                const iconDiv = el.querySelector('div');
                if(iconDiv) iconDiv.classList.add('opacity-70', 'nav-icon-inactive');
            });
            const activeNav = document.getElementById(`nav-${tabName}`);
            if (activeNav) {
                activeNav.classList.remove('text-slate-400');
                activeNav.classList.add('text-blue-600', 'font-semibold');
                const activeIconDiv = activeNav.querySelector('div');
                if(activeIconDiv) activeIconDiv.classList.remove('opacity-70', 'nav-icon-inactive');
            }

            // ====================================================================
            // [SEKAT TAB 1] TAB HOME (GRID 8 MENU UTAMA)
            // ====================================================================
            if (tabName === 'home') {
                mainContent.innerHTML = `
                    <section class="${activeUserData.isLunas ? 'bg-gradient-to-r from-emerald-600 to-emerald-500 shadow-emerald-100' : 'bg-gradient-to-r from-blue-600 to-blue-500 shadow-blue-100'} rounded-3xl p-6 text-white shadow-md mt-2 relative overflow-hidden">
                        <div class="absolute -right-10 -top-10 w-32 h-32 bg-white opacity-10 rounded-full"></div>
                        <div class="absolute -right-4 -bottom-10 w-24 h-24 bg-white opacity-10 rounded-full"></div>
                        
                        <h3 class="text-xs font-medium opacity-80 tracking-wide">${activeUserData.isLunas ? 'Sisa Tagihan Bulan Ini' : 'Tagihan Belum Bayar'}</h3>
                        <div class="text-3xl font-extrabold mt-2 tracking-tight">Rp ${activeUserData.isLunas ? '0' : activeUserData.nominalAsli}</div>
                        <p class="text-xs opacity-90 mt-1">${activeUserData.isLunas ? 'Layanan aktif penuh' : '1 tagihan aktif'}</p>
                        
                        <button onclick="switchTab('tagihan')" class="absolute right-5 bottom-6 bg-white text-blue-600 font-semibold text-xs px-4 py-2 rounded-xl shadow-sm hover:bg-slate-50 transition-colors">
                            Detail
                        </button>
                    </section>

                    <!-- GRID 8 MENU KATEGORI -->
                    <section class="grid grid-cols-4 gap-3">
                        <button onclick="switchTab('tagihan')" class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm border border-slate-100/50 hover:bg-slate-50 transition-colors">
                            <div class="w-10 h-10 icon-3d-blue rounded-xl flex items-center justify-center mb-1.5">
                                <i class="fa-solid fa-file-invoice-dollar text-base drop-shadow-md"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-slate-700 text-center leading-tight">Tagihan Wifi</span>
                        </button>
                        <button onclick="switchTab('paket')" class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm border border-slate-100/50 hover:bg-slate-50 transition-colors">
                            <div class="w-10 h-10 icon-3d-emerald rounded-xl flex items-center justify-center mb-1.5">
                                <i class="fa-solid fa-hand-holding-dollar text-base drop-shadow-md"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-slate-700 text-center leading-tight">Iuran Kampung</span>
                        </button>
                        <button onclick="switchTab('bantuan')" class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm border border-slate-100/50 hover:bg-slate-50 transition-colors">
                            <div class="w-10 h-10 icon-3d-amber rounded-xl flex items-center justify-center mb-1.5">
                                <i class="fa-solid fa-wallet text-base drop-shadow-md"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-slate-700 text-center leading-tight">Bayar</span>
                        </button>
                        <button onclick="switchTab('akun')" class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm border border-slate-100/50 hover:bg-slate-50 transition-colors">
                            <div class="w-10 h-10 icon-3d-purple rounded-xl flex items-center justify-center mb-1.5">
                                <i class="fa-solid fa-user text-base drop-shadow-md"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-slate-700 text-center leading-tight">Akun</span>
                        </button>

                        <button onclick="switchTab('listrik')" class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm border border-slate-100/50 hover:bg-slate-50 transition-colors">
                            <div class="w-10 h-10 icon-3d-amber rounded-xl flex items-center justify-center mb-1.5">
                                <i class="fa-solid fa-bolt text-base drop-shadow-md"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-slate-700 text-center leading-tight">BYAR listrik</span>
                        </button>
                        <button onclick="switchTab('lampu')" class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm border border-slate-100/50 hover:bg-slate-50 transition-colors">
                            <div class="w-10 h-10 icon-3d-rose rounded-xl flex items-center justify-center mb-1.5">
                                <i class="fa-solid fa-lightbulb text-base drop-shadow-md"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-slate-700 text-center leading-tight">Beli Lampu</span>
                        </button>
                        <button onclick="switchTab('print')" class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm border border-slate-100/50 hover:bg-slate-50 transition-colors">
                            <div class="w-10 h-10 icon-3d-cyan rounded-xl flex items-center justify-center mb-1.5">
                                <i class="fa-solid fa-print text-base drop-shadow-md"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-slate-700 text-center leading-tight">Prin...</span>
                        </button>
                        <button onclick="switchTab('jastip')" class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm border border-slate-100/50 hover:bg-slate-50 transition-colors">
                            <div class="w-10 h-10 icon-3d-purple rounded-xl flex items-center justify-center mb-1.5">
                                <i class="fa-solid fa-bag-shopping text-base drop-shadow-md"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-slate-700 text-center leading-tight">jastip</span>
                        </button>
                    </section>

                    <!-- STATISTIK LAYANAN -->
                    <section class="grid grid-cols-3 gap-3">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100/50">
                            <p class="text-[10px] font-medium text-slate-400">Total Layanan</p>
                            <p class="text-2xl font-bold text-blue-600 mt-1">${activeUserData.qtyJumlah}</p>
                            <p class="text-[10px] text-slate-400 mt-1">Services</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100/50">
                            <p class="text-[10px] font-medium text-slate-400">Total Tagihan</p>
                            <p class="text-2xl font-bold text-amber-500 mt-1">${activeUserData.isLunas ? '0' : '1'}</p>
                            <p class="text-[10px] text-slate-400 mt-1">${activeUserData.bulanIni}</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100/50">
                            <p class="text-[10px] font-medium ${activeUserData.isLunas ? 'text-emerald-500' : 'text-red-500'}">${activeUserData.statusTeks}</p>
                            <p class="text-2xl font-bold ${activeUserData.isLunas ? 'text-emerald-500' : 'text-red-500'} mt-1">${activeUserData.isLunas ? '0' : '1'}</p>
                            <p class="text-[10px] text-slate-400 mt-1">Invoice</p>
                        </div>
                    </section>
                `;
            } 
            // ====================================================================
            // [SEKAT TAB 2] TAB TAGIHAN WIFI
            // ====================================================================
            else if (tabName === 'tagihan') {
                const badgeWarna = activeUserData.isLunas ? "bg-emerald-50 text-emerald-500" : "bg-red-50 text-red-500";
                const nominalWarna = activeUserData.isLunas ? "text-emerald-500" : "text-red-500";
                mainContent.innerHTML = `
                    <div class="space-y-4 pt-2">
                        <div class="flex items-center space-x-2">
                            <div class="w-1 h-5 bg-blue-600 rounded-full"></div>
                            <h2 class="text-sm font-bold text-slate-800">Rincian Tagihan Internet</h2>
                        </div>
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
                            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                                <div>
                                    <span class="text-[10px] text-slate-400 font-medium uppercase">Periode</span>
                                    <p class="text-xs font-bold text-slate-700 mt-0.5">${activeUserData.bulanIni}</p>
                                </div>
                                <span class="${badgeWarna} font-bold text-[9px] px-3 py-1 rounded-full uppercase tracking-wider">
                                    ${activeUserData.statusTeks}
                                </span>
                            </div>
                            <div class="space-y-2">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="text-slate-400">Harga Paket</span>
                                    <span class="font-semibold text-slate-700">Rp ${activeUserData.formattedBasePaket}</span>
                                </div>
                                <div class="border-t border-dashed border-slate-200 my-2"></div>
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-bold text-slate-800">Total Pembayaran</span>
                                    <span class="text-lg font-black ${nominalWarna}">Rp ${activeUserData.nominalAsli}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            // ====================================================================
            // [SEKAT TAB 3] TAB VOUCHER (LENGKAP DENGAN TOMBOL SALIN)
            // ====================================================================
            else if (tabName === 'voucher') {
                let voucherRowsHTML = (!activeUserData.vouchers || activeUserData.vouchers.length === 0) 
                    ? `<div class="py-8 text-center text-xs text-slate-400 bg-white rounded-2xl border border-slate-100 shadow-sm">Tidak ada voucher aktif.</div>`
                    : activeUserData.vouchers.map((v) => `
                        <div class="p-3.5 flex justify-between items-center text-xs">
                            <div class="space-y-0.5">
                                <span class="font-mono font-black text-sm text-blue-400 tracking-wider block">${v.kode}</span>
                                <span class="text-[10px] text-slate-55
                                00 font-medium">Status: ${v.status || 'Aktif'}</span>
                            </div>
                            <button onclick="salinVoucher('${v.kode}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold text-[10px] px-3 py-1.5 rounded-xl border border-blue-200 transition-colors flex items-center space-x-1 active:scale-95">
                                <i class="fa-regular fa-copy"></i>
                                <span>Salin</span>
                            </button>
                        </div>
                    `).join('');

                mainContent.innerHTML = `
                    <div class="space-y-3 pt-2">
                        <div class="flex items-center space-x-2">
                            <div class="w-1 h-5 bg-cyan-500 rounded-full"></div>
                            <h2 class="text-sm font-bold text-slate-800">Daftar Kode Voucher Hotspot</h2>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 divide-y divide-slate-100 overflow-hidden">
                            ${voucherRowsHTML}
                        </div>
                    </div>
                `;

                            </p>
                        </div>

                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
                            <h4 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Form Titip Belanja</h4>
                            
                            <div class="space-y-3">
                                <div>
                                    <label class="text-[10px] font-semibold text-slate-500 block mb-1">Daftar Barang / Makanan yang Dibeli</label>
                                    <textarea id="input-jastip-detail" rows="3" placeholder="Contoh:&#10;- Minyak Goreng 1L&#10;- Telur 1/2 kg&#10;- Nasi Goreng Pak Budi 1 bungkus" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-500 transition-colors"></textarea>
                                </div>

                                <div>
                                    <label class="text-[10px] font-semibold text-slate-500 block mb-1">Toko / Lokasi Pembelian (Opsional)</label>
                                    <input type="text" id="input-jastip-lokasi" placeholder="Contoh: Pasar Tradisional / Warung Bu Ani" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-500 transition-colors">
                                </div>

                                <button onclick="kirimPesananJastip()" id="btn-kirim-jastip" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl py-3 text-xs shadow-sm transition-colors flex justify-center items-center space-x-2">
                                    <i class="fa-solid fa-paper-plane"></i>
                                    <span>KIRIM PERMINTAAN JASTIP</span>
                                </button>
                                <p id="msg-jastip" class="text-xs text-center hidden"></p>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // ====================================================================
        // [SEKAT FUNGSI PENGIRIMAN DATA] KE GOOGLE APPS SCRIPT
        // ====================================================================

        // 1. Switch Mode Token / Tagihan Listrik
        function switchModeListrik(mode) {
            const btnToken = document.getElementById('btn-mode-token');
            const btnTagihan = document.getElementById('btn-mode-tagihan');
            const secToken = document.getElementById('section-token');
            const secTagihan = document.getElementById('section-tagihan');

            if (mode === 'token') {
                btnToken.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-white text-amber-600 shadow-sm transition-all";
                btnTagihan.className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-700 transition-all";
                secToken.classList.remove('hidden');
                secTagihan.classList.add('hidden');
            } else {
                btnTagihan.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-white text-amber-600 shadow-sm transition-all";
                btnToken.className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-700 transition-all";
                secTagihan.classList.remove('hidden');
                secToken.classList.add('hidden');
            }
        }

        // 2. Kirim Order Listrik / Token
        function kirimOrderListrik(jenisPaket, harga) {
            const idpel = document.getElementById('input-idpel').value.trim();
            const msgEl = document.getElementById('msg-listrik');

            if (!idpel) {
                msgEl.innerText = "Nomor IDPEL / No. Meter tidak boleh kosong!";
                msgEl.className = "text-xs text-center text-red-500 font-semibold";
                msgEl.classList.remove('hidden');
                return;
            }

            if (!confirm(`Konfirmasi pembelian ${jenisPaket} (${harga}) untuk IDPEL: ${idpel}?`)) return;

            msgEl.innerText = "Memproses pesanan...";
            msgEl.className = "text-xs text-center text-blue-600 font-semibold";
            msgEl.classList.remove('hidden');

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "bayarListrik",
                    idUser: activeUserData.idUser,
                    namaMember: activeUserData.nama,
                    idpel: idpel,
                    jenis: jenisPaket,
                    harga: harga
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    msgEl.innerText = res.message;
                    msgEl.className = "text-xs text-center text-emerald-600 font-semibold";
                } else {
                    msgEl.innerText = "Gagal memproses pesanan listrik.";
                    msgEl.className = "text-xs text-center text-red-500 font-semibold";
                }
            })
            .catch(err => {
                msgEl.innerText = "Gagal terhubung ke server.";
                msgEl.className = "text-xs text-center text-red-500 font-semibold";
            });
        }

        // 3. Kirim Order Lampu LED
        function pesanLampu(watt, harga) {
            const msgEl = document.getElementById('msg-lampu');
            if (!confirm(`Konfirmasi pemesanan Lampu LED ${watt} seharga Rp ${harga}?`)) return;

            msgEl.innerText = "Mengirim pesanan...";
            msgEl.className = "text-xs text-center text-blue-600 font-semibold";
            msgEl.classList.remove('hidden');

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "beliLampu",
                    idUser: activeUserData.idUser,
                    namaMember: activeUserData.nama,
                    item: `Lampu LED ${watt}`,
                    harga: harga
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    msgEl.innerText = res.message;
                    msgEl.className = "text-xs text-center text-emerald-600 font-semibold";
                } else {
                    msgEl.innerText = "Gagal memesan lampu.";
                    msgEl.className = "text-xs text-center text-red-500 font-semibold";
                }
            });
        }

        // 4. Kirim Order Print / Scan / Copy
        function kirimPesananPrint() {
            const layanan = document.getElementById('select-layanan-print').value;
            const detail = document.getElementById('input-detail-print').value.trim();
            const msgEl = document.getElementById('msg-print');
            const btnSubmit = document.getElementById('btn-kirim-print');

            if (!detail) {
                msgEl.innerText = "Mohon isi detail pesanan Anda!";
                msgEl.className = "text-xs text-center text-red-500 font-semibold";
                msgEl.classList.remove('hidden');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<span>Memproses...</span>`;

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "orderPrint",
                    idUser: activeUserData.idUser,
                    namaMember: activeUserData.nama,
                    layanan: layanan,
                    detail: detail
                })
            })
            .then(res => res.json())
            .then(res => {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>KIRIM PESANAN PRINT</span>`;
                if (res.success) {
                    document.getElementById('input-detail-print').value = "";
                    msgEl.innerText = res.message;
                    msgEl.className = "text-xs text-center text-emerald-600 font-semibold";
                } else {
                    msgEl.innerText = "Gagal mengirim pesanan.";
                    msgEl.className = "text-xs text-center text-red-500 font-semibold";
                }
                msgEl.classList.remove('hidden');
            });
        }

        // 5. Kirim Order Jastip Belanja
        function kirimPesananJastip() {
            const detail = document.getElementById('input-jastip-detail').value.trim();
            const lokasi = document.getElementById('input-jastip-lokasi').value.trim();
            const msgEl = document.getElementById('msg-jastip');
            const btnSubmit = document.getElementById('btn-kirim-jastip');

            if (!detail) {
                msgEl.innerText = "Tuliskan daftar belanjaan yang ingin dititip!";
                msgEl.className = "text-xs text-center text-red-500 font-semibold";
                msgEl.classList.remove('hidden');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<span>Memproses...</span>`;

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "orderJastip",
                    idUser: activeUserData.idUser,
                    namaMember: activeUserData.nama,
                    detail: detail,
                    lokasi: lokasi
                })
            })
            .then(res => res.json())
            .then(res => {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>KIRIM PERMINTAAN JASTIP</span>`;
                if (res.success) {
                    document.getElementById('input-jastip-detail').value = "";
                    document.getElementById('input-jastip-lokasi').value = "";
                    msgEl.innerText = res.message;
                    msgEl.className = "text-xs text-center text-emerald-600 font-semibold";
                } else {
                    msgEl.innerText = "Gagal mengirim pesanan Jastip.";
                    msgEl.className = "text-xs text-center text-red-500 font-semibold";
                }
                msgEl.classList.remove('hidden');
            });
        }

        // ------------------------------------------------------------------------
        // Logout App & Salin Voucher
        // ------------------------------------------------------------------------
        function logoutApp() {
            localStorage.removeItem('sesi_pelanggan_bytel');
            window.location.reload();
        }

        function salinVoucher(kode) {
            navigator.clipboard.writeText(kode).then(() => {
                alert("Kode voucher " + kode + " berhasil disalin!");
            });
        }
    </script>
</body>
</html>
